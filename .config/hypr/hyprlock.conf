general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/terencezeng/Pictures/Wallpapers/kimi_no_na_wa.jpg
}

animation {
    animation = fadeOut, 0, 0, default
}

# clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 75
    font_family = Iosevka Nerd Font
    position = 4%, -4%
    halign = left
    valign = top
}

# systemctl icons 
label {
    monitor =
    text = 󰒲 : Sleep [Mod+Shift+S]    󰜉 : Reboot [Mod+Shift+R]
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = Iosevka Nerd Font
    position = 0, 20
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 10%, 50
    inner_color = rgba(0, 0, 0, 0.5)

    blur_passes = 2
    blur_size = 5

    placeholder_text =
    fail_text =

    # input box appearance
    outline_thickness = 2
    fade_on_empty = false
    outer_color = rgb(ffffff)
    check_color = rgb(0, 255, 0)
    fail_color = rgb(255, 0, 0)

    # input box positioning
    position = 0, 70
    halign = center
    valign = bottom
    
    # dots appearance
    font_color = rgb(255, 255, 255)
    rounding = 0
    dots_rounding = 0
    dots_spacing = 0.3
}

